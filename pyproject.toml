[project]
name = "krillion"
version = "0.1.0"
description = "Voice trivia where the rarest correct answer wins"
requires-python = ">=3.11,<3.14"
dependencies = [
  "ai-api-unified[openai,google_gemini,voice]>=3.28.0",
  "wordfreq>=3.1",
  "rapidfuzz>=3.9",
  "metaphone>=0.6",
  "httpx>=0.27",
]

[dependency-groups]
dev = ["pytest>=8.3", "scipy>=1.14"]
# Google Trends for the catalog build (optional: the build skips the signal without it)
build = ["pytrends>=4.9.2", "urllib3<2"]  # pytrends still uses a urllib3 1.x argument

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
